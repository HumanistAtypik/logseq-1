# AppImage linux x64 de la Version personnalisée : Logseq corrigé (db-test#1557).
# Fondé sur le flux de parution officiel build-desktop-release.yml, réduit à linux x64.
# Se déclenche à chaque poussée au maître (donc à chaque fusion de suivi vers l'amont)
# et manuellement depuis l'onglet Actions.
name: Build-AppImage-Version-Personnalisee

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-appimage
  cancel-in-progress: true

env:
  CLOJURE_VERSION: "1.12.4.1618"
  NODE_VERSION: "24"
  JAVA_VERSION: "21"
  OCAML_VERSION: "5.1.1"

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Get pnpm store directory path
        id: pnpm-store-dir-path
        run: echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store directory
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store-dir-path.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-lib-${{ hashFiles('**/deps.edn') }}

      - name: Setup clojure
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: ${{ env.CLOJURE_VERSION }}

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - name: Fetch OCaml deps
        working-directory: cli
        run: opam install . --deps-only --with-test --yes

      - name: Fetch CLI pnpm deps
        run: pnpm --dir cli install --frozen-lockfile --ignore-workspace

      - name: Stamp app version (Version personnalisée)
        run: |
          sed -i 's/defonce version ".*"/defonce version "2.0.3_Version_personnalisée_2"/' src/main/frontend/version.cljs
          grep -n "defonce version" src/main/frontend/version.cljs

      - name: Set build environment variables
        run: |
          echo "ENABLE_PLUGINS=true" >> $GITHUB_ENV
          echo "ENABLE_FILE_SYNC_PRODUCTION=true" >> $GITHUB_ENV

      - name: Compile CLJS
        run: |
          pnpm install --frozen-lockfile
          gulp build
          pnpm cljs:release-electron
          pnpm db-worker-node:bundle
          opam exec -- pnpm cli:release
          pnpm webpack-app-build
          pnpm desktop:prepare-runtime-js

      - name: Verify bundled db-worker-node runtime
        run: |
          test -f ./dist/db-worker-node.js
          test -f ./dist/db-worker-node-assets.json

      - name: Verify bundled CLI
        run: |
          test -f ./static/js/logseq-cli.js
          node ./static/js/logseq-cli.js --help >/tmp/logseq-cli-help.txt
          grep -E "USAGE|Usage|COMMANDS|Commands" /tmp/logseq-cli-help.txt >/dev/null

      - name: Verify desktop runtime script locations
        run: |
          test -f ./static/js/db-worker-node.js
          test -f ./static/js/logseq-cli.js
          test -f ./static/.agents/skills/logseq-cli/SKILL.md

      - name: Stamp package version (semver)
        working-directory: ./static
        run: |
          sed -i "s/\"version\": \"0.0.1\"/\"version\": \"2.0.3-Version-personnalisee.2\"/" ./package.json
          sed -i "s/\"version\": \"2.0.3\"/\"version\": \"2.0.3-Version-personnalisee.2\"/" ./package.json
          grep "\"version\"" ./package.json
          test "$(node -p "require(\"./package.json\").version")" = "2.0.3-Version-personnalisee.2"
          echo "2.0.3_Version_personnalisée_2" > ./VERSION

      - name: Build/Release Electron App
        working-directory: ./static
        run: pnpm install --frozen-lockfile && pnpm electron:make

      - name: Verify packaged embedding sidecar
        run: test -f static/dist/linux-unpacked/resources/sidecar/embedding_server.py

      - name: Gather artifacts
        run: |
          mkdir -p builds
          cp static/VERSION ./builds/VERSION
          mv static/dist/*.AppImage ./builds/
          shopt -s nullglob
          blockmaps=(static/dist/*.blockmap)
          if [ ${#blockmaps[@]} -gt 0 ]; then
            mv static/dist/*.blockmap ./builds/
          fi
          mv static/dist/latest-linux.yml ./builds/latest-linux.yml
          cd builds
          sha256sum VERSION *.AppImage > SHA256SUMS.txt
          ls -al

      - name: Publish rolling release
        uses: andelf/nightly-release@5834076edc55cc05975561c9722043f072ac5c26
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: Version_personnalisée
          name: "Version personnalisée $$"
          draft: false
          prerelease: true
          body: |
            Logseq corrigé : le bogue des liens de pages imbriqués affichés en matricules (db-test#1557) est corrigé dans ce bâtiment.
            AppImage linux x64, bâtie du maître de ce dépôt : l'amont officiel du jour plus la permutation F1, rien d'autre.
            Version affichée dans l'app : 2.0.3_Version_personnalisée_2.
          files: |
            ./builds/*
